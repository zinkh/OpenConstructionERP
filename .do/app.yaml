name: openconstructionerp

services:
  - name: api
    source_dir: /
    environment_slug: python
    build_command: pip install -r requirements.txt
    run_command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --app-dir backend
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
    envs:
      - key: APP_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "false"
      - key: VECTOR_BACKEND
        value: lancedb
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
