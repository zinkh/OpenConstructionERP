name: openconstructionerp

services:
  - name: app
    dockerfile_path: deploy/docker/Dockerfile.unified
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
    envs:
      - key: APP_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: VECTOR_BACKEND
        value: lancedb
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
